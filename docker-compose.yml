services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zerotrace
      POSTGRES_USER: zerotrace
      POSTGRES_PASSWORD: zerotrace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerotrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/zerotrace
      SPRING_DATASOURCE_USERNAME: zerotrace
      SPRING_DATASOURCE_PASSWORD: zerotrace
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:

